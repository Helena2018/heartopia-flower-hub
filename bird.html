<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartopia - Wildlife Radar & Checklist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-hover {
            transition: all 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }
        .caught-card {
            background-color: #f0fdf4 !important;
            border-color: #bbf7d0 !important;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-stone-500 hover:text-stone-800 text-sm font-medium transition">← Home</a>
                <span class="text-stone-300">|</span>
                <span class="text-xl">🦤</span>
                <h1 class="font-bold text-stone-800 text-lg">Wildlife Radar & Checklist</h1>
            </div>
            <!-- Language Switcher Placeholder / Title -->
            <div class="text-xs text-stone-500 bg-stone-100 px-3 py-1.5 rounded-full font-medium">
                Heartopia Companion
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 space-y-6">

        <!-- Progress Bar Section (P0 Feature) -->
        <section class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-stone-800 text-lg">Collection Progress</h2>
                    <p class="text-xs text-stone-500">Track your captured birds and insects in Heartopia</p>
                </div>
                <div class="text-right">
                    <span id="progress-text" class="text-2xl font-black text-emerald-600">0 / 0</span>
                    <span id="progress-percent" class="text-xs text-stone-500 block font-medium">(0%)</span>
                </div>
            </div>
            <!-- Progress Bar Graphic -->
            <div class="w-full bg-stone-100 h-3 rounded-full overflow-hidden border border-stone-200">
                <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%;"></div>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm space-y-4">
            <h2 class="font-bold text-stone-800 text-sm uppercase tracking-wider text-stone-400">Filters</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Search Input -->
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Search Name</label>
                    <input type="text" id="search-input" placeholder="e.g. Sparrow, Butterfly..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                </div>

                <!-- Weather Filter -->
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Weather</label>
                    <select id="weather-filter" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                        <option value="all">All Weather</option>
                        <option value="Sunny">Sunny ☀️</option>
                        <option value="Rainy">Rainy 🌧️</option>
                        <option value="Rainbow">Rainbow 🌈</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Category</label>
                    <select id="category-filter" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                        <option value="all">All Categories</option>
                        <option value="Bird">Birds 🦤</option>
                        <option value="Insect">Insects 🦋</option>
                    </select>
                </div>

                <!-- Status Filter (Show Uncaught Only) -->
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Collection Status</label>
                    <select id="status-filter" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                        <option value="all">All Status</option>
                        <option value="uncaught">Uncaught Only ❌</option>
                        <option value="caught">Caught Only ✅</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Species Grid Container -->
        <section>
            <div id="species-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Cards will be dynamically injected by JavaScript -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-400 mt-auto">
        Heartopia Companion Tool • Data saved locally in your browser
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Sample Species Database (Will be expanded with more Heartopia data)
        const speciesData = [
            { id: "b1", name: "Tree Sparrow", category: "Bird", weather: "Sunny", time: "Daytime", location: "Town Square", rarity: 1, icon: "🐤" },
            { id: "b2", name: "Blue Jay", category: "Bird", weather: "Sunny", time: "Morning", location: "Forest Area", rarity: 3, icon: "🐦" },
            { id: "b3", name: "Rainbow Lorikeet", category: "Bird", weather: "Rainbow", time: "All Day", location: "Mountain Peak", rarity: 5, icon: "🦜" },
            { id: "i1", name: "Cabbage Butterfly", category: "Insect", weather: "Sunny", time: "Daytime", location: "Flower Garden", rarity: 1, icon: "🦋" },
            { id: "i2", name: "Rainy Dragonfly", category: "Insect", weather: "Rainy", time: "Afternoon", location: "Lake Side", rarity: 3, icon: "🦗" },
            { id: "i3", name: "Golden Beetle", category: "Insect", weather: "Sunny", time: "Night", location: "Deep Woods", rarity: 5, icon: "🪲" }
        ];

        // Load saved caught status from localStorage (Key: heartopia_caught_ids)
        let caughtIds = new Set(JSON.parse(localStorage.getItem('heartopia_caught_ids') || '[]'));

        // DOM Elements
        const grid = document.getElementById('species-grid');
        const searchInput = document.getElementById('search-input');
        const weatherFilter = document.getElementById('weather-filter');
        const categoryFilter = document.getElementById('category-filter');
        const statusFilter = document.getElementById('status-filter');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');

        // Render species cards based on filters
        function renderCards() {
            grid.innerHTML = '';

            const searchTerm = searchInput.value.toLowerCase().trim();
            const weatherVal = weatherFilter.value;
            const categoryVal = categoryFilter.value;
            const statusVal = statusFilter.value;

            // Filter data
            const filtered = speciesData.filter(item => {
                const isCaught = caughtIds.has(item.id);
                
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || item.location.toLowerCase().includes(searchTerm);
                const matchesWeather = weatherVal === 'all' || item.weather === weatherVal;
                const matchesCategory = categoryVal === 'all' || item.category === categoryVal;
                
                let matchesStatus = true;
                if (statusVal === 'caught') matchesStatus = isCaught;
                if (statusVal === 'uncaught') matchesStatus = !isCaught;

                return matchesSearch && matchesWeather && matchesCategory && matchesStatus;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-stone-400">
                        <p class="text-2xl mb-2">🔍</p>
                        <p class="text-sm">No species found matching the current filters.</p>
                    </div>
                `;
                return;
            }

            // Generate HTML for cards
            filtered.forEach(item => {
                const isCaught = caughtIds.has(item.id);
                const stars = "★".repeat(item.rarity) + "☆".repeat(5 - item.rarity);

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-5 border border-stone-200 shadow-sm card-hover relative transition-all ${isCaught ? 'caught-card' : ''}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-stone-100 flex items-center justify-center text-2xl">
                                ${item.icon}
                            </div>
                            <div>
                                <span class="text-[10px] font-bold text-amber-500 tracking-wider uppercase">${stars}</span>
                                <h3 class="font-bold text-stone-800 text-base leading-tight">${item.name}</h3>
                            </div>
                        </div>
                        
                        <!-- Toggle Caught Checkbox -->
                        <button onclick="toggleCaught('${item.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition ${isCaught ? 'bg-emerald-600 text-white' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}">
                            ${isCaught ? '✅ Caught' : '+ Catch'}
                        </button>
                    </div>

                    <div class="mt-4 pt-3 border-t border-stone-100 grid grid-cols-2 gap-2 text-xs text-stone-500">
                        <div>
                            <span class="block text-[10px] uppercase text-stone-400 font-semibold">Weather / Time</span>
                            <span class="font-medium text-stone-700">${item.weather} • ${item.time}</span>
                        </div>
                        <div>
                            <span class="block text-[10px] uppercase text-stone-400 font-semibold">Location</span>
                            <span class="font-medium text-stone-700">${item.location}</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Toggle caught state and update localStorage + UI
        function toggleCaught(id) {
            if (caughtIds.has(id)) {
                caughtIds.delete(id);
            } else {
                caughtIds.add(id);
            }
            // Save to browser local storage
            localStorage.setItem('heartopia_caught_ids', JSON.stringify(Array.from(caughtIds)));
            
            updateProgress();
            renderCards();
        }

        // Update top progress bar statistics
        function updateProgress() {
            const total = speciesData.length;
            const count = caughtIds.size;
            const percentage = Math.round((count / total) * 100);

            progressText.innerText = `${count} / ${total}`;
            progressPercent.innerText = `(${percentage}%)`;
            progressBar.style.width = `${percentage}%`;
        }

        // Add event listeners for controls
        searchInput.addEventListener('input', renderCards);
        weatherFilter.addEventListener('change', renderCards);
        categoryFilter.addEventListener('change', renderCards);
        statusFilter.addEventListener('change', renderCards);

        // Initial setup
        updateProgress();
        renderCards();
    </script>
</body>
</html>
